[workspace]
resolver = "3"
members = ["crates/navis-app", "crates/navis-parser", "crates/navis-runtime"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
authors = ["Carlos J. Ortiz <ortizdcj@gmail.com>"]
publish = false
repository = "https://github.com/carlosjortiz/navis"

[workspace.dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-single-instance = { version = "2", features = ["semver"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
json5 = "0.4"
tempfile = "3"
thiserror = "2"
tree-sitter = "0.25"
# path dep — local fork with tree-sitter 0.25 ABI fix; replace once upstream publishes v0.1.1
tree-sitter-json5 = { path = "D:/third-party/tree-sitter-json5" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
