[workspace]
resolver = "3"
members = ["crates/navis-app"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
authors = ["Carlos J. Ortiz <ortizdcj@gmail.com>"]
publish = false
repository = "https://github.com/carlosjortiz/navis"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
